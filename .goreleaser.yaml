version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: postura
    main: .
    binary: postura
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Perdiga/postura/internal/version.Version={{.Version}}
      - -X github.com/Perdiga/postura/internal/version.Commit={{.Commit}}
      - -X github.com/Perdiga/postura/internal/version.BuildDate={{.Date}}

archives:
  - id: postura
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - examples/rules.yaml
      - examples/config.yaml

release:
  extra_files:
    - glob: examples/rules.yaml
    - glob: examples/config.yaml

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
