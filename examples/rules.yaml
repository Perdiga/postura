# postura default ruleset — a generic GitHub security baseline, expressed as data.
# Each rule's `pass` is a CEL expression over the scope's fact fields (bound as
# top-level variables) plus `cfg` (the rule's merged config). `applies_when`
# scopes a rule to matching targets. When a fact a rule needs was not readable
# (e.g. missing scope), the collector omits it and postura reports unknown
# automatically — no per-rule annotation needed. Tune any `config` knob per
# enterprise/org/repo in the policy-config file (--config).
rules:
  # ---- enterprise ---------------------------------------------------------
  - id: ENT-1
    scope: enterprise
    severity: error
    title: SAML single sign-on is configured for the enterprise
    pass: saml_sso_url != null
    fix_hint: Enterprise Settings -> Authentication security -> configure SAML single sign-on

  - id: ENT-2
    scope: enterprise
    severity: warn
    title: Enterprise base repository permission is not write/admin
    pass: >-
      (default_repository_permission == null ? "NO_POLICY" : default_repository_permission)
        in ["NO_POLICY", "NONE", "READ"]
    fix_hint: "Enterprise Settings -> Policies -> Repositories -> Base permissions: set to None or Read (or leave to orgs)"

  - id: ENT-3
    scope: enterprise
    severity: info
    title: IP allow list is enabled for the enterprise
    enabled: false # opt-in: enable per enterprise in --config when network policy requires it
    pass: ip_allow_list_enabled == "ENABLED"
    fix_hint: Enterprise Settings -> Authentication security -> Enable IP allow list

  - id: ENT-4
    scope: enterprise
    severity: warn
    title: Private/internal repository forking is restricted
    config:
      allowed_forking: ["DISABLED", "NO_POLICY"] # tighten to ["DISABLED"] to forbid deferral
    pass: allow_private_repository_forking in cfg.allowed_forking
    fix_hint: "Enterprise Settings -> Policies -> Repositories -> Repository forking: restrict forking of private/internal repos"

  - id: ENT-5
    scope: enterprise
    severity: error
    title: Enterprise has no outside collaborators
    pass: outside_collaborator_count == 0
    fix_hint: "Enterprise -> People -> Outside collaborators: convert to members or remove"

  # ---- org ----------------------------------------------------------------
  - id: ORG-1
    scope: org
    severity: error
    title: Two-factor authentication is enforced org-wide
    pass: two_factor_requirement_enabled == true
    fix_hint: Org Settings -> Authentication security -> Require two-factor authentication

  - id: ORG-2
    scope: org
    severity: warn
    title: Owner/admin count is proportionate to org size
    config:
      max_admins: 5
      max_admin_ratio: 0.25
    pass: >-
      admin_count <= cfg.max_admins &&
      (member_count == 0 || double(admin_count) / double(member_count) <= cfg.max_admin_ratio)
    fix_hint: "Org Settings -> People: review who holds Owner; downgrade to Member where possible"

  - id: ORG-3
    scope: org
    severity: warn
    title: Outside collaborators are known and current
    config:
      allowed_collaborators: [] # allowlist expected outside-collaborator logins per org
    pass: outside_collaborators.all(c, c in cfg.allowed_collaborators)
    fix_hint: "Org Settings -> Outside collaborators: remove anyone no longer active, or allowlist expected logins in --config"

  - id: ORG-4
    scope: org
    severity: warn
    title: Default member repository permission is not write/admin
    pass: >-
      (default_repository_permission == null ? "none" : default_repository_permission)
        in ["none", "read"]
    fix_hint: "Org Settings -> Member privileges -> Base permissions: set to None or Read"

  - id: ORG-5
    scope: org
    severity: info
    title: No member invitations pending longer than the allowed age
    config:
      max_invite_age_days: 30
    pass: invitations.all(i, i.age_days == null || i.age_days <= cfg.max_invite_age_days)
    fix_hint: "Org Settings -> People -> Pending invitations: cancel or re-send stale invites"

  - id: ORG-6
    scope: org
    severity: warn
    title: Members cannot create repositories
    pass: members_can_create_repositories == false
    fix_hint: "Org Settings -> Member privileges -> Repository creation: disable member repo creation"

  - id: ORG-7
    scope: org
    severity: warn
    title: New repositories get secret scanning, push protection, and Dependabot by default
    pass: >-
      secret_scanning_enabled_for_new_repositories == true &&
      secret_scanning_push_protection_enabled_for_new_repositories == true &&
      dependabot_alerts_enabled_for_new_repositories == true
    fix_hint: Org Settings -> Code security -> enable "Automatically enable for new repositories" for Secret scanning, Push protection, and Dependabot alerts

  - id: ORG-8
    scope: org
    severity: warn
    title: Members cannot fork private/internal repositories
    pass: members_can_fork_private_repositories == false
    fix_hint: "Org Settings -> Member privileges -> Repository forking: disable forking of private/internal repos"

  - id: ORG-9
    scope: org
    severity: info
    title: Org teams are private (privacy = closed)
    config:
      allowed_secret_teams: [] # teams intentionally kept secret
    pass: teams.all(t, t.privacy == "closed" || t.slug in cfg.allowed_secret_teams)
    fix_hint: "Org Settings -> Teams: set team visibility to 'closed' unless intentionally secret and allowlisted"

  - id: ORG-10
    scope: org
    severity: warn
    title: Organization-role grants of broad repo access are intentional and minimal
    config:
      broad_role_markers: ["admin", "write", "maintain"] # role-name substrings treated as broad
      allowed_broad_teams: [] # teams permitted to hold a broad org role
    pass: >-
      organization_roles.all(r,
        cfg.broad_role_markers.exists(m, r.role.lowerAscii().contains(m))
          ? (r.users.size() == 0 && r.teams.all(t, t.slug in cfg.allowed_broad_teams))
          : true)
    fix_hint: "Org Settings -> Organization roles: limit broad (all-repository) admin/write/maintain to one intentional ops team; remove individual-user assignments. Needs admin:org to read."

  # ---- repo ---------------------------------------------------------------
  - id: REPO-1
    scope: repo
    severity: error
    title: Default branch requires a pull request before merging
    pass: archived == true || protection.required_pull_request_reviews == true
    fix_hint: Repo Settings -> Branches/Rules -> require a pull request before merging on the default branch (add push bots to bypass_actors as actor_type=Integration)

  - id: REPO-2
    scope: repo
    severity: error
    title: At least one approving review is required
    pass: archived == true || protection.required_approving_review_count >= 1
    fix_hint: Branch protection / ruleset -> require approvals (>= 1) on the default branch

  - id: REPO-3
    scope: repo
    severity: error
    title: Secret scanning is enabled (public repos)
    applies_when: archived != true && visibility == "public"
    pass: secret_scanning == "enabled"
    fix_hint: Repo Settings -> Code security and analysis -> enable Secret scanning (private/internal need GitHub Advanced Security)

  - id: REPO-4
    scope: repo
    severity: warn
    title: Dependabot / vulnerability alerts are enabled
    pass: archived == true || vulnerability_alerts == true
    fix_hint: Repo Settings -> Code security and analysis -> enable Dependabot alerts

  - id: REPO-5
    scope: repo
    severity: info
    title: CODEOWNERS file is present
    pass: archived == true || codeowners == true
    fix_hint: Add a CODEOWNERS file in .github/, repo root, or docs/

  - id: REPO-6
    scope: repo
    severity: info
    title: Public repository declares a license
    pass: visibility != "public" || (license != null && license != "NOASSERTION")
    fix_hint: Add a LICENSE file so the repository's license is detected

  - id: REPO-7
    scope: repo
    severity: info
    title: Default branch is governed by at least one active ruleset
    enabled: false # opt-in: for orgs standardizing on rulesets over classic protection
    pass: archived == true || ruleset_count >= 1
    fix_hint: "Repo Settings -> Rules: add a branch ruleset targeting the default branch"

  - id: REPO-8
    scope: repo
    severity: info
    title: Archived repositories are not public
    enabled: false # opt-in: enable per org where public archives are unwanted
    applies_when: archived == true
    pass: visibility != "public"
    fix_hint: "Archived repos are read-only, so exposure is the only risk. To privatize: unarchive -> set private -> re-archive."

  - id: REPO-9
    scope: repo
    severity: error
    title: Push protection is enabled (public repos)
    applies_when: archived != true && visibility == "public"
    pass: secret_scanning_push_protection == "enabled"
    fix_hint: Repo Settings -> Code security and analysis -> enable Push protection

  - id: REPO-10
    scope: repo
    severity: info
    title: Default branch requires code owner review
    pass: archived == true || protection.require_code_owner_reviews == true
    fix_hint: Branch protection / ruleset on the default branch -> Require review from Code Owners

  - id: REPO-11
    scope: repo
    severity: warn
    title: No team holds admin/maintain via a direct per-repo grant (push cap)
    pass: teams.all(t, t.permission != "admin" && t.permission != "maintain")
    fix_hint: "Cap direct (github_team_repository) team grants at 'push'; downgrade any team holding admin/maintain. Org-role grants are audited by ORG-10."

  - id: REPO-12
    scope: repo
    severity: warn
    title: PR-bypass is restricted to automation (bots/Apps)
    applies_when: archived != true && protection.required_pull_request_reviews == true
    pass: protection.pr_bypass_actor_types.all(a, a == "Integration")
    fix_hint: "On any ruleset that requires a PR, keep bypass to bot/App actors only (actor_type Integration); remove Team/RepositoryRole/OrganizationAdmin/user bypass."

  - id: REPO-13
    scope: repo
    severity: info
    title: Automated dependency updates are configured (Dependabot or Renovate)
    pass: archived == true || dependabot_config == true || renovate_config == true
    fix_hint: "Add .github/dependabot.yml (version updates) or a Renovate config (renovate.json)"

  # REPO-5 only proves a CODEOWNERS file exists. These two score whether it works:
  # GitHub silently ignores lines whose owner it can't resolve, so a file full of
  # typo'd handles reviews as if it were empty.
  # A repo with no CODEOWNERS has vacuously zero errors, so scope this to repos
  # that have one — REPO-5 already scores presence, and a pass here would read as
  # a claim about a file that doesn't exist.
  - id: REPO-14
    scope: repo
    severity: warn
    title: CODEOWNERS file has no unknown owners or syntax errors
    applies_when: archived != true && codeowners == true
    pass: codeowners_error_count == 0
    fix_hint: "Open the CODEOWNERS file on GitHub to see the flagged lines; an unknown owner usually means that user or team lacks write access on the repo"

  # The same defect where it actually costs something: protection claims code-owner
  # review is required, but the unresolvable lines own nothing, so those paths merge
  # on any ordinary approval. No CODEOWNERS at all is the worst case of this, not an
  # exemption from it — every path merges on an ordinary approval — so the pass
  # demands the file exists rather than trusting its vacuous zero error count.
  - id: REPO-15
    scope: repo
    severity: error
    title: Required code-owner review is not silently voided by a broken CODEOWNERS
    applies_when: archived != true && protection.require_code_owner_reviews == true
    pass: codeowners == true && codeowners_error_count == 0
    fix_hint: "Code-owner review is required but GitHub cannot resolve every CODEOWNERS entry (or there is no CODEOWNERS at all); the paths those lines should own are merging without owner approval. Fix the flagged owners, add the file, or drop the requirement."

  # Open Dependabot alerts, scored as a remediation SLA rather than a count. A
  # count-based bar (`critical == 0`) flips a green pipeline red the day an
  # advisory is published, with nothing changed on your side and nothing yet to
  # do about it; an age-based one only fires once the alert has gone unhandled
  # past the window you set, which is the part that is actually your posture.
  #
  # Age is counted from the alert's created_at, which GitHub never resets: a
  # dismissed-then-reopened (or fixed-then-regressed) alert re-enters with its
  # full original age and can breach the window on day one — a conservative
  # false red, since the exposure itself really is that old. A severity bucket
  # holding an alert GitHub reported without a created_at omits its
  # oldest_open_days entirely, so this rule reports unknown rather than
  # trusting an age floor.
  #
  # Ships disabled, like any rule whose bar is a policy choice rather than a
  # baseline: enable it per org/repo in --config once you've picked your windows.
  - id: REPO-16
    scope: repo
    severity: warn
    enabled: false
    title: Open critical/high Dependabot alerts are within the remediation SLA
    config:
      critical_days: 7
      high_days: 30
    # Gated on alerts being enabled: the org sweep only reports repos that have
    # them on, so a repo scanning nothing would otherwise zero-fill to a green
    # "within SLA". A repo with them off is REPO-4's finding, not this one's.
    applies_when: archived != true && vulnerability_alerts == true
    pass: >-
      dependabot_alerts.critical.oldest_open_days <= cfg.critical_days &&
      dependabot_alerts.high.oldest_open_days <= cfg.high_days
    fix_hint: "Security -> Dependabot alerts: upgrade the flagged dependencies, or dismiss the alerts that don't apply with a reason"


  - id: REPO-19
    scope: repo
    severity: error
    title: Default branch requires at least one status check
    pass: archived == true || protection.required_status_checks == true
    fix_hint: "Branch protection / ruleset -> require at least one status check before merging"

  - id: REPO-20
    scope: repo
    severity: warn
    title: Required status checks apply to the latest commit
    pass: archived == true || protection.branches_up_to_date == true
    fix_hint: "Branch protection / ruleset -> require branches to be up to date before merging"

  - id: REPO-21
    scope: repo
    severity: warn
    title: New commits dismiss stale approvals
    pass: archived == true || protection.dismiss_stale_reviews == true
    fix_hint: "Branch protection / ruleset -> dismiss stale pull request approvals when new commits are pushed"

  - id: REPO-22
    scope: repo
    severity: warn
    title: Pull request conversations must be resolved before merging
    pass: archived == true || protection.require_conversation_resolution == true
    fix_hint: "Branch protection / ruleset -> require conversation resolution before merging"

  - id: REPO-23
    scope: repo
    severity: warn
    title: Default branch requires signed commits
    pass: archived == true || protection.require_signed_commits == true
    fix_hint: "Branch protection / ruleset -> require signed commits on the default branch"

  - id: REPO-24
    scope: repo
    severity: info
    title: Default branch requires linear history
    pass: archived == true || protection.require_linear_history == true
    fix_hint: "Branch protection / ruleset -> require linear history on the default branch"

  - id: REPO-25
    scope: repo
    severity: warn
    title: Force pushes are disabled on the default branch
    pass: archived == true || protection.allow_force_pushes == false
    fix_hint: "Branch protection / ruleset -> block force pushes on the default branch"

  - id: REPO-26
    scope: repo
    severity: warn
    title: Deletion of the default branch is disabled
    pass: archived == true || protection.allow_deletions == false
    fix_hint: "Branch protection / ruleset -> block deletion of the default branch"

  - id: REPO-27
    scope: repo
    severity: info
    title: Review dismissal is restricted
    pass: archived == true || protection.restrict_dismissals == true
    fix_hint: "Branch protection -> restrict who can dismiss pull request reviews"

  - id: REPO-28
    scope: repo
    severity: info
    title: Direct pushes to the default branch are restricted
    pass: archived == true || protection.restrict_pushes == true
    fix_hint: "Branch protection -> restrict who can push to the default branch"

  - id: REPO-29
    scope: repo
    severity: warn
    title: Ruleset bypass is limited to automation
    config:
      allowed_bypass_actor_types: [Integration]
    pass: >-
      archived == true || protection.ruleset_bypass_actor_types.all(
        a, a in cfg.allowed_bypass_actor_types)
    fix_hint: "Remove user/team/role bypass actors from default-branch rulesets or explicitly allowlist required automation"

  - id: REPO-17
    scope: repo
    severity: warn
    title: GitHub Actions are pinned to immutable commit SHAs
    pass: archived == true || unpinned_action_ref_count == 0
    fix_hint: "In each workflow, replace mutable action tags or branches with the full 40-character commit SHA; use Dependabot to keep pinned actions updated"

  - id: REPO-18
    scope: repo
    severity: error
    title: Workflow jobs avoid implicit or broad write GITHUB_TOKEN permissions
    pass: archived == true || workflow_permission_issue_count == 0
    fix_hint: "Set workflow- or job-level permissions explicitly; grant only read/none scopes and add write permissions only to the specific job that needs them"

  - id: ORG-18
    scope: org
    severity: warn
    title: GitHub Actions are restricted to selected repositories
    pass: actions_enabled_repositories != "all"
    fix_hint: "Org Settings -> Actions -> General -> Repository access: select only repositories that need Actions"

  - id: ORG-19
    scope: org
    severity: warn
    title: GitHub Actions are restricted to trusted actions
    pass: actions_allowed_actions in ["selected", "local_only"]
    fix_hint: "Org Settings -> Actions -> General -> Policies: allow GitHub/verified actions and explicitly approved actions only"

  - id: ORG-20
    scope: org
    severity: warn
    title: Default workflow token permission is read-only
    pass: actions_default_workflow_permissions == "read"
    fix_hint: "Org Settings -> Actions -> General -> Workflow permissions: choose read repository contents permission"

  - id: ORG-21
    scope: org
    severity: error
    title: Workflows cannot approve pull requests
    pass: actions_can_approve_pull_request_reviews == false
    fix_hint: "Org Settings -> Actions -> General -> Workflow permissions: disable allowing Actions to create and approve pull requests"

  # These assessment rules read `assessment` from the matching target entry in
  # --config. Missing inputs are unknown; not_applicable skips the rule.
  - id: ENT-6
    scope: enterprise
    assessment: true
    severity: warn
    title: GHAS licensing and repository coverage are understood
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record GHAS licensing coverage, eligible repositories, and any repositories outside the coverage policy"

  - id: ENT-7
    scope: enterprise
    severity: warn
    title: Enterprise prevents repository visibility changes
    pass: members_can_change_repository_visibility == "DISABLED"
    fix_hint: "Enterprise Settings -> Policies -> Repository visibility change: disable member changes"

  - id: ENT-8
    scope: enterprise
    severity: warn
    title: Enterprise limits who can invite outside collaborators
    pass: members_can_invite_collaborators == "DISABLED"
    fix_hint: "Enterprise Settings -> Policies -> Outside collaborators: allow only enterprise or organization owners to invite"

  - id: ENT-9
    scope: enterprise
    severity: error
    title: Two-factor authentication is enforced for the enterprise
    pass: two_factor_required_setting == "ENABLED"
    fix_hint: "Enterprise Settings -> Authentication security: require two-factor authentication for all organizations"

  - id: ENT-10
    scope: enterprise
    severity: warn
    title: Enterprise members cannot create public repositories
    pass: members_can_create_public_repositories == false
    fix_hint: "Enterprise Settings -> Policies -> Repository creation: prevent members from creating public repositories"

  - id: ENT-11
    scope: enterprise
    severity: warn
    title: Enterprise prevents repository deletion and transfer by admins
    pass: members_can_delete_repository == "DISABLED"
    fix_hint: "Enterprise Settings -> Policies -> Repositories: disable repository deletion and transfer by repository admins"

  - id: ENT-12
    scope: enterprise
    severity: info
    title: Enterprise email notifications are restricted to verified domains
    pass: notification_delivery_restriction_enabled == "ENABLED"
    fix_hint: "Enterprise Settings -> Verified and approved domains: restrict notification delivery to approved domains"

  - id: ORG-11
    scope: org
    assessment: true
    severity: warn
    title: Disaster recovery and backup procedures are tested
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document backup coverage, recovery objectives, and a recent successful restore exercise"

  - id: ORG-12
    scope: org
    assessment: true
    severity: info
    title: Teams use a documented work-tracking system
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record the work-tracking system and how engineering work is linked to repositories and changes"

  - id: ORG-13
    scope: org
    assessment: true
    severity: info
    title: InnerSource contribution practices are established
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document cross-team contribution guidance, ownership, and review expectations"

  - id: ORG-14
    scope: org
    assessment: true
    severity: warn
    title: CI/CD performance is monitored and reviewed
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record CI/CD performance signals, ownership, and review cadence"

  - id: ORG-15
    scope: org
    assessment: true
    severity: info
    title: Repository onboarding is automated
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document the automated repository onboarding process and its security defaults"

  - id: ORG-16
    scope: org
    assessment: true
    severity: warn
    title: Runner isolation and exposure are reviewed
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record runner ownership, isolation, network boundaries, and protections against untrusted workflows"

  - id: ORG-17
    scope: org
    assessment: true
    severity: info
    title: GitHub Discussions have an intentional purpose and owner
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record whether Discussions are enabled and their purpose, or mark the assessment not applicable"

  - id: REPO-30
    scope: repo
    assessment: true
    severity: info
    title: Branch naming conventions are documented and enforced
    applies_when: archived != true && cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document the branch naming convention and how repository rulesets or CI enforce it"

  - id: REPO-31
    scope: repo
    severity: warn
    title: Repository publishes a security vulnerability reporting policy
    pass: archived == true || repository_files.security_policy == true
    fix_hint: "Add SECURITY.md at the repository root, .github/, or docs/ with supported versions and a private reporting path"

  - id: REPO-32
    scope: repo
    severity: info
    title: Repository has contribution guidance
    pass: archived == true || repository_files.contributing_guide == true
    fix_hint: "Add CONTRIBUTING.md at the repository root, .github/, or docs/"

  - id: REPO-33
    scope: repo
    severity: info
    title: Repository has a pull request template
    pass: archived == true || repository_files.pull_request_template == true
    fix_hint: "Add a pull request template under .github/ or at the repository root"

  - id: REPO-34
    scope: repo
    severity: info
    title: Repository has issue templates
    pass: archived == true || repository_files.issue_templates == true
    fix_hint: "Add issue templates under .github/ISSUE_TEMPLATE/"

  - id: REPO-35
    scope: repo
    severity: info
    title: Repository has Copilot instructions
    pass: archived == true || repository_files.copilot_instructions == true
    fix_hint: "Add .github/copilot-instructions.md or scoped instructions under .github/instructions/"

  - id: REPO-36
    scope: repo
    severity: warn
    title: Repository configures CodeQL or another SAST tool
    pass: archived == true || repository_files.sast_configuration == true || codeql_action_count > 0
    fix_hint: "Configure CodeQL or an approved SAST tool such as Semgrep or SonarQube"

  - id: REPO-37
    scope: repo
    severity: warn
    title: Dependency review runs in GitHub Actions
    pass: archived == true || dependency_review_action_count > 0
    fix_hint: "Add actions/dependency-review-action to a required pull request workflow"

  - id: REPO-38
    scope: repo
    severity: warn
    title: CI workflows run on pull requests
    pass: archived == true || workflow_pr_trigger_count > 0
    fix_hint: "Add a pull_request trigger to the repository's CI/test workflow"

  - id: REPO-39
    scope: repo
    severity: info
    title: Repository uses reusable workflows
    pass: archived == true || reusable_workflow_count > 0
    fix_hint: "Consider centralizing repeated CI logic in reviewed reusable workflows"

  - id: REPO-40
    scope: repo
    severity: info
    title: Workflow dependencies are cached
    pass: archived == true || cache_action_count > 0
    fix_hint: "Add a dependency cache such as actions/cache or a language setup action's cache option"

  - id: REPO-41
    scope: repo
    severity: info
    title: Workflows use concurrency controls
    pass: archived == true || concurrency_workflow_count > 0
    fix_hint: "Add a concurrency group with cancel-in-progress where overlapping runs are safe"

  - id: REPO-42
    scope: repo
    severity: info
    title: Workflow triggers use branch or path filters
    pass: archived == true || narrow_trigger_count > 0
    fix_hint: "Narrow workflow triggers with paths/branches filters where appropriate"

  - id: REPO-43
    scope: repo
    severity: info
    title: Workflows use matrix strategies where useful
    pass: archived == true || matrix_job_count > 0
    fix_hint: "Use a strategy matrix to test supported language/runtime versions in parallel where applicable"

  - id: REPO-44
    scope: repo
    severity: info
    title: Releases are automated
    pass: archived == true || release_automation_count > 0
    fix_hint: "Consider release-please, semantic-release, Changesets, or another reviewed release automation"

  - id: REPO-45
    scope: repo
    severity: info
    title: Stale issues and pull requests are managed automatically
    pass: archived == true || stale_issue_automation_count > 0
    fix_hint: "Configure an issue lifecycle policy such as actions/stale if it fits the repository's support model"

  - id: REPO-46
    scope: repo
    severity: info
    title: Repository has recent development activity
    config:
      max_days_since_push: 90
    pass: archived == true || last_pushed_days <= cfg.max_days_since_push
    fix_hint: "Review whether the repository is still needed; archive it or document why its current inactivity is expected"

  - id: REPO-47
    scope: repo
    severity: warn
    enabled: false
    title: Repository Actions secrets are rotated within policy
    config:
      max_secret_age_days: 365
    pass: archived == true || oldest_actions_secret_age_days <= cfg.max_secret_age_days
    fix_hint: "Rotate repository Actions secrets older than the configured limit; only secret metadata is collected"

  - id: REPO-48
    scope: repo
    severity: warn
    title: Individual repository admin access is limited
    config:
      max_admins: 3
      max_admin_ratio: 0.05
    pass: >-
      archived == true ||
      (admin_collaborator_count <= cfg.max_admins &&
       (collaborator_count == 0 ||
        double(admin_collaborator_count) / double(collaborator_count) <= cfg.max_admin_ratio))
    fix_hint: "Review repository collaborators and downgrade unnecessary individual admins; tune the count and ratio per repo in --config"

  - id: REPO-49
    scope: repo
    severity: warn
    enabled: false
    title: Production environments require reviewers
    config:
      production_environment_names: [production, prod]
    pass: >-
      archived == true || environments.exists(e,
        cfg.production_environment_names.exists(n, e.name.lowerAscii() == n) &&
        e.required_reviewers == true)
    fix_hint: "Add required reviewers to the production GitHub Environment; configure the environment name per repo in --config"

  - id: ORG-25
    scope: org
    assessment: true
    severity: warn
    title: Cloud deployments use OIDC instead of long-lived credentials
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document cloud identity federation coverage and remove long-lived deployment credentials where OIDC is supported"

  - id: REPO-50
    scope: repo
    assessment: true
    severity: warn
    title: Deployment rollback and recovery procedures are tested
    applies_when: archived != true && cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Document the rollback/recovery mechanism and evidence from a recent exercise"

  - id: REPO-51
    scope: repo
    severity: info
    title: Repository accepts private vulnerability reports
    applies_when: archived != true && visibility == "public"
    pass: private_vulnerability_reporting == true
    fix_hint: "Repo Settings -> Security -> enable private vulnerability reporting"

  - id: REPO-52
    scope: repo
    severity: warn
    title: Private/internal repository forking is disabled
    applies_when: archived != true && visibility in ["private", "internal"]
    pass: allow_forking == false
    fix_hint: "Repo Settings -> General -> Features: disable forking for private/internal repositories unless explicitly approved"

  - id: ORG-22
    scope: org
    severity: warn
    enabled: false
    title: Organization Actions secrets are rotated within policy
    config:
      max_secret_age_days: 365
    pass: oldest_actions_secret_age_days <= cfg.max_secret_age_days
    fix_hint: "Rotate organization Actions secrets older than the configured limit; only secret metadata is collected"

  - id: ORG-23
    scope: org
    severity: error
    title: Runner groups cannot run workflows from public repositories
    pass: runner_groups.all(g, g.allows_public_repositories == false)
    fix_hint: "Org Settings -> Actions -> Runner groups: disable public repository access for every group"

  - id: ORG-24
    scope: org
    severity: warn
    title: Runner groups are limited to selected repositories
    pass: runner_groups.all(g, g.visibility == "selected")
    fix_hint: "Org Settings -> Actions -> Runner groups: grant access only to repositories that require each group"

  - id: ORG-26
    scope: org
    severity: warn
    title: Members cannot create public repositories
    pass: members_can_create_public_repositories == false
    fix_hint: "Org Settings -> Member privileges -> Repository creation: disable public repository creation for members"

  - id: ORG-27
    scope: org
    severity: warn
    title: New repositories get GitHub Advanced Security by default
    pass: advanced_security_enabled_for_new_repositories == true
    fix_hint: "Org Settings -> Code security -> automatically enable Advanced Security for new repositories"

  - id: ORG-28
    scope: org
    assessment: true
    severity: warn
    title: Stale members and administrators are reviewed and removed
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Review inactive member/admin access on a regular cadence and remove or downgrade accounts no longer needed"

  - id: ORG-29
    scope: org
    assessment: true
    severity: warn
    title: Organization SSO is configured and enforced
    applies_when: cfg.assessment.status != "not_applicable"
    pass: cfg.assessment.status == "compliant"
    fix_hint: "Record the organization SAML/SSO configuration and enforcement status"

  - id: ENT-13
    scope: enterprise
    severity: warn
    title: New repositories get GitHub Advanced Security by default
    pass: advanced_security_enabled_for_new_repositories == true
    fix_hint: "Enterprise Settings -> Code security -> automatically enable Advanced Security for new repositories"

  - id: ENT-14
    scope: enterprise
    severity: warn
    title: New repositories get secret scanning by default
    pass: secret_scanning_enabled_for_new_repositories == true
    fix_hint: "Enterprise Settings -> Code security -> automatically enable secret scanning for new repositories"

  - id: ENT-15
    scope: enterprise
    severity: warn
    title: New repositories get secret scanning push protection by default
    pass: secret_scanning_push_protection_enabled_for_new_repositories == true
    fix_hint: "Enterprise Settings -> Code security -> automatically enable secret scanning push protection for new repositories"
